<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanCymatics — Safety</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        body { background: #0b0f1a; }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- Top bar -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10">
        <!-- Left group -->
        <div class="flex items-center gap-3">
            <button id="hamburger-btn"
                    class="w-9 h-9 flex items-center justify-center rounded-md text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors text-lg"
                    title="Toggle sidebar">&#9776;</button>
            <span class="font-bold text-base tracking-tight text-slate-100">HumanCymatics</span>
            <span class="text-xs bg-blue-900 text-blue-300 px-2 py-0.5 rounded-full font-medium">Safety</span>
            <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded border border-slate-700">Demo data</span>
        </div>

        <!-- Right group -->
        <div class="flex items-center gap-2">
            <select id="scenario-select"
                    class="bg-slate-800 text-slate-200 text-sm border border-slate-700 rounded-md px-3 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer">
                <option value="baseline">Baseline (50 ppl)</option>
                <option value="concert_peak">Concert Peak (200 ppl)</option>
                <option value="evacuation_drill">Evacuation Drill (150 ppl)</option>
            </select>
            <button id="btn-pause"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-md text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg>
                Pause
            </button>
            <button id="btn-resume"
                    class="hidden items-center gap-1.5 px-3 py-1.5 bg-green-700 hover:bg-green-600 text-white rounded-md text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.27l9.344-5.891a1.5 1.5 0 000-2.54L6.3 2.84z"/></svg>
                Resume
            </button>
            <button id="btn-reset"
                    class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-md text-sm transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                Reset
            </button>
            <div id="sim-time" class="font-mono text-sm text-slate-400 w-20 text-right">t: 0.0s</div>
        </div>
    </header>

    <!-- 3-column body -->
    <div class="flex flex-1 overflow-hidden">

        <!-- LEFT SIDEBAR -->
        <nav id="sidebar" class="bg-slate-900 border-r border-slate-800 flex flex-col py-2">
            <a href="#" class="nav-item active" aria-current="page">
                <span class="nav-icon">&#128737;</span>
                <span class="nav-label">Safety</span>
            </a>
            <a href="#" class="nav-item disabled" aria-disabled="true" tabindex="-1">
                <span class="nav-icon">&#128202;</span>
                <span class="nav-label">Sponsor Analytics</span>
            </a>
            <a href="#" class="nav-item disabled" aria-disabled="true" tabindex="-1">
                <span class="nav-icon">&#127918;</span>
                <span class="nav-label">Simulation Suite</span>
            </a>
            <div class="flex-1"></div>
            <a href="#" class="nav-item disabled" aria-disabled="true" tabindex="-1">
                <span class="nav-icon">&#128100;</span>
                <span class="nav-label">Account</span>
            </a>
        </nav>

        <!-- MAIN MAP AREA -->
        <main class="flex-1 flex flex-col overflow-hidden bg-[#0b0f1a] p-3 gap-3">

            <!-- Tab toggle + scenario info row -->
            <div class="flex items-center gap-4 shrink-0">
                <div class="flex rounded-lg overflow-hidden border border-slate-700">
                    <button id="tab-kde"
                            class="tab-btn tab-active px-4 py-1.5 text-sm">KDE Heatmap</button>
                    <button id="tab-est"
                            class="tab-btn px-4 py-1.5 text-sm">WiFi Estimate</button>
                </div>
                <span id="scenario-name" class="text-slate-400 text-sm font-medium">Baseline</span>
            </div>

            <!-- Map container -->
            <div class="flex-1 rounded-xl overflow-hidden bg-slate-900 border border-slate-800 relative">
                <div id="map-viewport">
                    <!-- SVG geometry layers -->
                    <svg id="map-svg" viewBox="0 0 1000 700"
                         xmlns="http://www.w3.org/2000/svg">
                        <g id="layer-rooms"></g>
                        <g id="layer-obstacles"></g>
                        <g id="layer-decor"></g>
                        <g id="layer-walls"></g>
                        <g id="layer-doors"></g>
                        <g id="layer-pois"></g>
                        <g id="layer-agents"></g>
                    </svg>
                    <!-- Heatmap PNG overlay -->
                    <img id="heatmap-overlay" src="" alt=""
                         style="opacity: 0.72;" />
                </div>
            </div>

            <!-- Legend -->
            <div class="flex items-center gap-3 shrink-0">
                <span class="text-xs text-slate-500">Low</span>
                <div class="legend-gradient h-2 w-28 rounded-full"></div>
                <span class="text-xs text-slate-500">High</span>
                <span class="text-xs text-slate-600 ml-2">Viridis density scale</span>
            </div>
        </main>

        <!-- RIGHT ALERTS PANEL -->
        <aside class="w-[340px] bg-slate-900 border-l border-slate-800 flex flex-col shrink-0">

            <!-- Panel header -->
            <div class="px-4 py-3 border-b border-slate-800">
                <div class="flex items-center justify-between">
                    <h2 class="font-semibold text-slate-100 text-sm">Safety Alerts</h2>
                    <div class="flex items-center gap-1.5">
                        <span id="badge-critical"
                              class="text-xs bg-red-900 text-red-300 px-1.5 py-0.5 rounded-full font-mono min-w-[1.25rem] text-center"></span>
                        <span id="badge-warning"
                              class="text-xs bg-yellow-900 text-yellow-300 px-1.5 py-0.5 rounded-full font-mono min-w-[1.25rem] text-center"></span>
                    </div>
                </div>
                <!-- Filter chips -->
                <div class="flex gap-2 mt-2">
                    <button class="filter-chip active" data-filter="all">All</button>
                    <button class="filter-chip" data-filter="critical">Critical</button>
                    <button class="filter-chip" data-filter="warning">Warning</button>
                </div>
            </div>

            <!-- Alert list -->
            <div id="alerts-list" class="flex-1 overflow-y-auto p-3 space-y-2">
                <div class="text-slate-500 text-sm text-center py-10">Connecting…</div>
            </div>
        </aside>
    </div>

    <!-- Status bar -->
    <div class="h-6 bg-slate-900 border-t border-slate-800 flex items-center px-4 gap-6 shrink-0">
        <span id="status-conn" class="text-slate-500 text-xs">○ Connecting…</span>
        <span id="status-agents" class="text-slate-600 text-xs">0 agents</span>
        <span class="text-slate-700 text-xs ml-auto">HumanCymatics Safety v1.0</span>
    </div>

    <script src="/static/js/maps.js"></script>
    <script src="/static/js/alerts.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
