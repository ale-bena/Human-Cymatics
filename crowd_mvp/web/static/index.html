<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HumanCymatics — Crowd Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plotly.js for 3-D surface — loaded before our scripts -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        body { background: #0b0f1a; }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- ── Top bar ──────────────────────────────────────────────────────── -->
    <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0 z-10">
        <!-- Brand -->
        <div class="flex items-center gap-2.5">
            <span class="font-bold text-sm tracking-tight text-slate-100">HumanCymatics</span>
            <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded-full font-medium">Crowd Intelligence</span>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2">
            <select id="scenario-select"
                    class="bg-slate-800 text-slate-200 text-xs border border-slate-700 rounded px-2.5 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer">
                <option value="baseline">Baseline</option>
                <option value="concert_peak">Concert Peak</option>
                <option value="evacuation_drill">Evacuation Drill</option>
            </select>
            <div class="flex items-center gap-1" title="Agent count — applies on Reset">
                <input type="number" id="n-people-input"
                       min="10" max="700" value="150"
                       class="bg-slate-800 text-slate-200 text-xs border border-slate-700 rounded px-2 py-1.5 w-16 text-center focus:outline-none focus:border-blue-500">
                <span class="text-slate-500 text-xs">ppl</span>
            </div>
            <button id="btn-pause"
                    class="flex items-center gap-1 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-xs transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg>
                Pause
            </button>
            <button id="btn-resume"
                    class="hidden items-center gap-1 px-2.5 py-1.5 bg-green-700 hover:bg-green-600 text-white rounded text-xs transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 2.84A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.27l9.344-5.891a1.5 1.5 0 000-2.54L6.3 2.84z"/></svg>
                Resume
            </button>
            <button id="btn-reset"
                    class="flex items-center gap-1 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-xs transition-colors">
                <svg class="w-3.5 h-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
                Reset
            </button>
            <div id="sim-time" class="font-mono text-xs text-slate-400 w-16 text-right">t: 0.0s</div>
        </div>
    </header>

    <!-- ── 3-panel demo grid ─────────────────────────────────────────────── -->
    <div class="demo-grid flex-1 overflow-hidden p-2 gap-2">

        <!-- Panel A · Live Crowd Density map + heatmap overlay -->
        <div class="panel-a rounded-xl bg-slate-900 border border-slate-800 overflow-hidden relative flex flex-col">
            <!-- Panel header row -->
            <div class="flex items-center gap-3 px-3 py-2 shrink-0 border-b border-slate-800">
                <span class="panel-title">Live Crowd Density</span>
                <!-- KDE / WiFi tab toggle -->
                <div class="flex rounded overflow-hidden border border-slate-700 ml-auto">
                    <button id="tab-kde" class="tab-btn tab-active px-3 py-1 text-xs">KDE</button>
                    <button id="tab-est" class="tab-btn px-3 py-1 text-xs">WiFi Estimate</button>
                </div>
                <!-- Scenario label -->
                <span id="scenario-name" class="text-slate-500 text-xs font-medium"></span>
            </div>
            <!-- Map -->
            <div class="flex-1 relative overflow-hidden">
                <div id="map-viewport">
                    <svg id="map-svg" viewBox="0 0 1000 700"
                         xmlns="http://www.w3.org/2000/svg">
                        <g id="layer-rooms"></g>
                        <image id="heatmap-overlay" x="0" y="0" width="1000" height="700"
                               href="" opacity="0.82" preserveAspectRatio="none"/>
                        <g id="layer-obstacles"></g>
                        <g id="layer-decor"></g>
                        <g id="layer-walls"></g>
                        <g id="layer-doors"></g>
                        <g id="layer-pois"></g>
                        <g id="layer-agents"></g>
                    </svg>
                </div>
            </div>
            <!-- Legend -->
            <div class="flex items-center gap-2 px-3 py-1.5 shrink-0 border-t border-slate-800">
                <span class="text-xs text-slate-600">Low</span>
                <div class="legend-gradient h-1.5 w-24 rounded-full"></div>
                <span class="text-xs text-slate-600">High</span>
                <span class="text-xs text-slate-700 ml-auto" id="status-agents">0 agents</span>
            </div>
        </div>

        <!-- Panel B · 3D Density Surface (Plotly) -->
        <div class="panel-b rounded-xl bg-[#0b0f1a] border border-slate-800 overflow-hidden relative flex flex-col">
            <div class="flex items-center px-3 py-2 shrink-0 border-b border-slate-800">
                <span class="panel-title">3D Density Surface</span>
                <span class="ml-auto text-xs text-slate-600 font-mono">plasma</span>
            </div>
            <div id="surface-div" class="flex-1 w-full"></div>
        </div>

        <!-- Panel C · Trajectory / Path Heatmap (Canvas accumulation) -->
        <div class="panel-c rounded-xl bg-[#080814] border border-slate-800 overflow-hidden relative flex flex-col">
            <div class="flex items-center px-3 py-2 shrink-0 border-b border-slate-800">
                <span class="panel-title">Cumulative Path Heatmap</span>
                <span class="ml-auto text-xs text-slate-600 font-mono">plasma · accumulating</span>
            </div>
            <div class="flex-1 relative overflow-hidden">
                <!-- Canvas fills its container via CSS -->
                <canvas id="trajectory-canvas" width="600" height="420"
                        class="trajectory-canvas"></canvas>
            </div>
        </div>

    </div>

    <!-- ── Status bar ────────────────────────────────────────────────────── -->
    <div class="h-5 bg-slate-900 border-t border-slate-800 flex items-center px-4 gap-6 shrink-0">
        <span id="status-conn" class="text-slate-500 text-xs">○ Connecting…</span>
        <span class="text-slate-700 text-xs ml-auto">HumanCymatics · Crowd Intelligence Demo</span>
    </div>

    <!-- Scripts — order matters: colormaps before trajectory, Plotly already loaded above -->
    <script src="/static/js/maps.js"></script>
    <script src="/static/js/alerts.js"></script>
    <script src="/static/js/colormaps.js"></script>
    <script src="/static/js/surface3d.js"></script>
    <script src="/static/js/trajectory.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
